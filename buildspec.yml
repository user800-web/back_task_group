version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20 # Elige la versión de Node.js que usas en tu proyecto.
    commands:
      - echo "Installing dependencies"
      - npm install -g typescript
      - npm ci
  pre_build:
    commands:
      - echo "Preparing build"
  build:
    commands:
      - echo "Running tests and type checks"
      - npm run build --if-present  # Esto ejecutará tsc (compilación de TypeScript)
  post_build:
    commands:
      - echo "Build completed"
artifacts:
  files:
    - "**/*" # Incluye todos los archivos generados, como los archivos .js generados.
  discard-paths: yes # Para mantener solo los archivos y no las carpetas.
